<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сторінку не знайдено</title>
<meta name="description" content="Такої сторінки немає.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1F2EF">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;700;800&family=Onest:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;700;800&family=Onest:wght@400;500;600&display=swap"></noscript>
<style>
:root{--paper:#F1F2EF;--ink:#0F1316;--steel:#58626B;--panel:#171C21;--accent:#E39A12;--on-accent:#0F1316;--accent-ink:#906514;--line:#C9CDCE;--on-panel:#F9FAF9;--muted-panel:#ACAFB0;--line-panel:rgba(249,250,249,.18);--panel-rgb:23,28,33;--card:#FFFFFF;--card-sel:#FAFAF9;--shade:#DADCD9;--danger:#B3261E;--r-btn:2px;--r-card:4px;--r-input:2px;--r-chip:2px;--display:'Geologica','Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--hw:700;--h1w:800;--h1:clamp(1.90rem,0.80rem + 2.60vw,3.30rem)}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--body);overflow-x:clip}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:var(--hw);letter-spacing:-.02em;line-height:1.12;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
:root{--gutter:clamp(20px,5vw,64px);--wrap:1240px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
.skip{position:absolute;left:16px;top:-80px;background:var(--ink);color:var(--paper);padding:10px 16px;z-index:80}
.skip:focus{top:8px}
.demo{background:var(--ink);color:var(--on-panel);font-size:.8125rem;line-height:1.35}
.demo__in{padding-block:7px}
.hd{padding-block:clamp(32px,6vw,72px) clamp(20px,3vw,36px)}
.hd h1{font-size:clamp(1.9rem,1rem + 2.8vw,3.1rem);font-weight:800;max-width:20em}
.hd p{margin-top:16px;color:var(--steel);max-width:44em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;padding:0;list-style:none}
.chips button{min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips button:hover{border-color:var(--ink)}
.grid{list-style:none;margin:0;padding:0 0 clamp(40px,6vw,80px);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:clamp(16px,2.4vw,28px)}
.grid li[hidden]{display:none}
.card{display:flex;flex-direction:column;height:100%;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--ac,var(--accent));border-radius:6px;text-decoration:none;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 22px 40px -28px rgba(15,19,22,.5)}
.card__ph{aspect-ratio:4/3;background:var(--pn,var(--panel));overflow:hidden;display:grid;place-items:center;color:var(--on-panel);font:800 3.5rem/1 var(--display)}
.card__ph img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.card__b{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;flex:1}
.card h3{font-size:1.2rem;overflow-wrap:anywhere}
.card .meta{color:var(--steel);font-size:.95rem}
.card .rate{font-variant-numeric:tabular-nums;font-weight:500;font-size:.95rem}
.card .star{color:var(--accent-ink)}
.card .go{margin-top:auto;padding-top:10px;font-weight:600;text-decoration:underline;text-decoration-color:var(--accent-ink);text-decoration-thickness:2px;text-underline-offset:4px}
footer{padding-block:28px;font-size:.88rem;color:var(--steel);border-top:1px solid var(--line)}
.nf{padding-block:clamp(48px,10vw,120px)}
.nf h1{font-size:clamp(2.2rem,1rem + 3vw,3.4rem);font-weight:800}
.nf p{color:var(--steel);margin-top:16px}
.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 24px;margin-top:28px;background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none;border-radius:2px;border:2px solid var(--ink)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (max-width:760px){.demo{font-size:.75rem}}
</style>
</head>
<body>
<div class="demo" role="note"><div class="wrap demo__in"><span>Демо-версії сайтів. Створено за відкритими даними Google Maps. Не є офіційними сайтами студій.</span></div></div>
<main class="wrap nf"><h1>Сторінку не знайдено</h1><p>Можливо, адреса змінилася. Відкрийте каталог демо-сайтів.</p><a class="btn" href="/">До каталогу</a></main>
</body>
</html>
